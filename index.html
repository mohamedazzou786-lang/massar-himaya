<style>

:root[data-theme="dark"]{--bg:#0f1a20;--ink:#e6eef2;--card:#17262e;--ac:#5cc4c0;--act:#08201f;--mut:#9fb2bc;--ln:#2b3d47}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.75 Tajawal,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--ln);padding:10px 16px}
.hr{max-width:560px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.br{font-weight:800;font-size:1rem;line-height:1.3}
.lg button{border:1px solid var(--ln);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;padding:4px 10px;border-radius:8px;cursor:pointer}
.lg button.on{border-color:var(--ac);font-weight:700}
.ex{background:#b3261e;color:#fff;border:0;border-radius:10px;font:800 1rem Tajawal,system-ui;padding:10px 14px;cursor:pointer;white-space:nowrap}
main{max-width:560px;margin:auto;padding:20px 16px 48px}
h1{font-size:1.5rem;line-height:1.4;margin:.2em 0 .6em}
h2{font-size:1.15rem;color:var(--ac);margin:1.5em 0 .45em}
.badge{display:inline-block;background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:4px 12px;font-size:.88rem;color:var(--mut);margin:2px 4px 8px 0}
.o{display:block;width:100%;text-align:start;padding:15px 16px;margin:9px 0;border:2px solid var(--ln);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.o.on{border-color:var(--ac);font-weight:700}
.p{display:block;width:100%;padding:15px;margin-top:14px;border:0;border-radius:14px;background:var(--ac);color:var(--act);font:800 1.05rem Tajawal,system-ui;cursor:pointer;text-align:center;text-decoration:none}
.p.sec{background:var(--card);color:var(--ink);border:2px solid var(--ln)}
.p[disabled]{opacity:.4;cursor:default}
.dg{background:#b3261e;color:#fff}
.bk{background:none;border:0;color:var(--mut);font:inherit;margin-top:14px;cursor:pointer;text-decoration:underline}
.c{background:var(--card);border:1px solid var(--ln);border-inline-start:5px solid var(--ac);border-radius:12px;padding:12px 16px;margin:10px 0}
.c p{margin:.3em 0}
ul{padding-inline-start:1.2em;margin:.4em 0}
li{margin:.45em 0}
.m{color:var(--mut);font-size:.92rem}
.toast{margin-top:10px;font-size:.92rem;font-weight:700;color:var(--ac);min-height:1.4em}
a{color:var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media print{header,.lg,.p,.bk,.toast{display:none!important}body{background:#fff;color:#000}.c{break-inside:avoid}}

var B1_BY_TYPE={
 0:['ابتعدي فوراً إلى مكان آمن. إذا تعرضتِ لاعتداء جسدي أو جنسي، توجهي مباشرة إلى مستعجلات المستشفى العمومي لإجراء الفحص الطبي والحصول على شهادة طبية أولية قبل زوال الآثار.','بعدي دابا لبلاصة آمنة. إلا تعرضتي لاعتداء جسدي ولا جنسي، سيري نيشان لمستعجلات السبيطار العمومي باش يديرو لك الفحص الطبي ويعطيوك شهادة طبية أولية قبل ما يمشيو الآثار.','Mettez-vous immédiatement à l’abri. En cas d’agression physique ou sexuelle, rendez-vous aux urgences de l’hôpital public pour un examen médical et un certificat médical initial avant la disparition des traces.'],
 1:['ابتعدي عن مصدر التهديد أو الإكراه وأخبري شخصا تثقين به. دوّني تواريخ وأوقات التهديدات أو الإهانات بدقة.','بعدي على مصدر التهديد ولا الإكراه وعلمي شي واحد كتثقي فيه. قيدي التواريخ والأوقات ديال التهديد ولا السب بدقة.','Éloignez-vous de la source de menace ou de contrainte et prévenez une personne de confiance. Notez précisément les dates et heures des faits.'],
 2:['لا توقّعي على أي تنازل تحت الضغط. إذا طُردتِ من بيت الزوجية، اطلبي فوراً تدخل الشرطة القضائية أو الدرك الملكي لمعاينة حالة الطرد.','ما تسني على حتى تنازل تحت الضغط. إلا تطردتي من بيت الزوجية، طلبي دابا تدخل البوليس ولا الجندرمة باش يعاينو حالة الطرد.','Ne signez aucune renonciation sous la contrainte. En cas d’expulsion du domicile conjugal, demandez immédiatement l’intervention de la police ou de la gendarmerie pour constater l’expulsion.'],
 3:['لا تمسحي الرسائل ولا الصور ولا التعليقات، ولا تحظري الحساب فوراً حتى توثّقيها بلقطات شاشة (Screenshots) واضحة تُظهر الرابط والتاريخ والرقم أو اسم الحساب.','ما تمسحيش الميساجات ولا التصاور ولا التعليقات، وما تبلوكيش الحساب دابا حتى تصوريهم (Screenshots) ويبان فيهم الليان والتاريخ والنمرة ولا سمية الحساب.','N’effacez ni messages, ni images, ni commentaires, et ne bloquez pas immédiatement le compte avant d’avoir pris des captures d’écran montrant le lien, la date et le numéro ou identifiant.'],
 4:['ابتعدي إلى مكان آمن وأخبري شخصا تثقين به. يمكنك التوجه مباشرة إلى أقرب خلية للتكفل لمساعدتك في تكييف وضعيتك وتحديد المسطرة المناسبة.','بعدي لبلاصة آمنة وعلمي شي واحد كتثقي فيه. تقدري تمشي نيشان لأقرب خلية للتكفل باش يعاونوك تحددي وضعيتك والمسطرة المناسبة.','Mettez-vous à l’abri et prévenez une personne de confiance. Vous pouvez vous adresser directement à la cellule de prise en charge la plus proche pour vous orienter.']
};

var WHERE_BY_TYPE={
 0:['خلية التكفل بالنساء بالمستشفى العمومي (للعلاج والشهادة الطبية) + خلية التكفل بالمحكمة الابتدائية (نائب وكيل الملك) أو مصالح الأمن الوطني / الدرك الملكي (المادة 10 من القانون 103.13).','خلية التكفل بالنساء فالسبيطار العمومي (للعلاج والشهادة الطبية) + خلية التكفل فالمحكمة الابتدائية (نائب وكيل الملك) ولا البوليس / الجندرمة (المادة 10 من القانون 103.13).','Cellule de prise en charge à l’hôpital public (soins et certificat médical) + cellule du tribunal de première instance (substitut du procureur) ou Police / Gendarmerie (art. 10, loi 103.13).'],
 1:['خلية التكفل بالمحكمة الابتدائية (تضم نائب وكيل الملك ومساعداً اجتماعياً) لتقديم شكاية وطلب تدابير الحماية، أو مصالح الشرطة / الدرك الملكي.','خلية التكفل فالمحكمة الابتدائية (فيها نائب وكيل الملك ومساعد اجتماعي) باش تقدمي شكاية وتطلبي تدابير الحماية، ولا مصالح البوليس / الجندرمة.','Cellule de prise en charge du tribunal de première instance (substitut du procureur et assistant social) pour déposer plainte et demander des mesures de protection, ou Police / Gendarmerie.'],
 2:['خلية التكفل بالمحكمة الابتدائية (للشكاية الجنائية بطرد الزوجة أو تبديد الأموال) + قسم قضاء الأسرة بالمحكمة الابتدائية (للمطالبة بالنفقة أو الرجوع لبيت الزوجية).','خلية التكفل فالمحكمة الابتدائية (للشكاية بطرد الزوجة ولا تبديد الفلوس) + قسم قضاء الأسرة فالمحكمة الابتدائية (باش تطلبي النفقة ولا الرجوع لبيت الزوجية).','Cellule de prise en charge du tribunal de première instance (plainte pénale pour expulsion ou dissipation de biens) + section de la justice de la famille (pension alimentaire ou réintégration du domicile conjugal).'],
 3:['خلية التكفل بالمحكمة الابتدائية (النيابة العامة المختصة بالجرائم الرقمية) أو فرقة محاربة الجريمة المعلوماتية بالأمن الوطني / الدرك الملكي، مع الإدلاء بالأدلة الرقمية المحفوظة.','خلية التكفل فالمحكمة الابتدائية (النيابة العامة المختصة فالجرائم الرقمية) ولا فرقة محاربة الجريمة المعلوماتية فالبوليس / الجندرمة، مع تقديم الأدلة الرقمية المحفوظة.','Cellule de prise en charge du tribunal de première instance (parquet compétent en cybercriminalité) ou brigade de lutte contre la cybercriminalité de la Police / Gendarmerie, avec les preuves numériques conservées.'],
 4:['خلايا التكفل موجودة في كل محكمة ابتدائية ومحكمة استئناف، وفي المستشفيات ومصالح العدل والصحة والشباب والمرأة والأمن الوطني والدرك الملكي (المادة 10). ابدئي بأقرب خلية في المحكمة الابتدائية.','خلايا التكفل كاينين فكل محكمة ابتدائية ومحكمة استئناف، وفالسبيطارات ومصالح العدل والصحة والشباب والمرأة والبوليس والجندرمة (المادة 10). بداي بأقرب خلية فالمحكمة الابتدائية.','Des cellules de prise en charge existent dans chaque tribunal de première instance et cour d’appel, les hôpitaux, les services de la justice, de la santé, de la jeunesse et de la femme, la Police et la Gendarmerie (art. 10). Commencez par celle du tribunal de première instance.']
};

function getLawCards(ty, ag){
 var out=[];

 if(has0){
  if(ag===0){
   out.push([
    'العنف الجسدي من الزوج أو الخطيب أو المطلق (ظرف تشديد - الفصل 404): تُشدَّد عقوبة الضرب والجرح لتصبح من سنة إلى 3 سنوات حبساً وغرامة من 2,000 إلى 10,000 درهم إذا لم يتجاوز العجز 20 يوماً، وتصل من سنتين إلى 5 سنوات حبساً إذا تجاوز العجز 20 يوماً.',
    'العنف الجسدي من الراجل ولا الخطيب ولا المطلق (ظرف تشديد - الفصل 404): العقوبة كتغلاض وكتولي من عام لـ 3 سنين حبس وغرامة من 2,000 لـ 10,000 درهم إلا كان العجز قل من 20 يوم، ومن عامين لـ 5 سنين حبس إلا فات العجز 20 يوم.',
    'Violence physique par l’époux, fiancé ou ex-conjoint (circonstance aggravante - art. 404) : 1 à 3 ans de prison et 2 000 à 10 000 DH d’amende si l’incapacité ≤ 20 jours, et 2 à 5 ans si l’incapacité > 20 jours.'
   ]);
  }else if(ag===1){
   out.push([
    'العنف الجسدي أو الجنسي من أحد أفراد العائلة أو الأصول أو من له سلطة/ولاية: تُشدَّد عقوبة الإيذاء (الفصل 404: من سنة إلى 5 سنوات حسب مدة العجز). وفي التحرش الجنسي من أحد الأصول أو المحارم أو من له ولاية أو سلطة، تصل العقوبة إلى السجن من 3 إلى 5 سنوات وغرامة من 5,000 إلى 50,000 درهم (الفصل 503-1-2).',

   ]);
  }else if(ag===2){
   out.push([
    'التحرش الجنسي في محيط العمل (الفصل 503-1-1 و503-1-2): العقوبة الأساسية للتحرش هي من شهر إلى 6 أشهر حبساً وغرامة من 2,000 إلى 10,000 درهم، وتُضاعَف العقوبة إذا كان المعتدي زميلاً في العمل أو من المكلفين بحفظ النظام، وترتفع إلى 3 إلى 5 سنوات حبساً إذا كانت له سلطة فعلية على الضحية.',
    'التحرش الجنسي فالخدمة (الفصل 503-1-1 و503-1-2): العقوبة الأساسية هي من شهر لـ 6 أشهر حبس وغرامة من 2,000 لـ 10,000 درهم، وكتضاعف إلا كان المعتدي زميل فالخدمة، وكتوصل من 3 لـ 5 سنين حبس إلا كانت عندو سلطة فعلية عليها.',
    'Harcèlement sexuel au travail (art. 503-1-1 et 503-1-2) : peine de base de 1 à 6 mois de prison et 2 000 à 10 000 DH d’amende, doublée si l’auteur est un collègue de travail, et portée à 3 à 5 ans s’il exerce une autorité sur la victime.'
   ]);

document.addEventListener('click',function(e){
 if(e.target.id=='ex'){out();return}

 else if(x=='tyn'){if(S.ty.length)go('ag')}
 else if(x=='ag'){S.ag=+v;go('res')}

  var txt=buildSummaryText();

   navigator.clipboard.writeText(txt).then(function(){if(toast)toast.textContent=t(U.cpd)}).catch(function(){if(toast)toast.textContent=t(U.cpd)});
  }else if(toast){toast.textContent=t(U.cpd)}
 }
 else if(x=='print'){window.print()}
 else if(x=='bk'){S.s=S.h.pop()||'d';R();window.scrollTo(0,0)}
});

dir();R();
